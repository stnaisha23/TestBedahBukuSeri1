<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal Kegiatan</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600&family=Public+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head><body>
<header class="top"><div class="top-in"><div class="brand"><span class="logo-box"><img id="logo" alt="" width="34" height="34"></span><div><small data-cfg="INSTANSI"></small><b>Portal Kegiatan</b></div></div></div></header>
<main>
  <section class="hero">
    <p class="jenis" data-cfg="JENIS"></p>
    <h1 data-cfg="KEGIATAN"></h1>
    <p class="tgl" data-cfg="TANGGAL_TEKS"></p>
  </section>

  <div class="hitung" id="hitung">
    <div><strong id="d">00</strong><span>Hari</span></div>
    <div><strong id="h">00</strong><span>Jam</span></div>
    <div><strong id="m">00</strong><span>Menit</span></div>
    <div><strong id="s">00</strong><span>Detik</span></div>
  </div>
  <div class="banner" id="status" hidden></div>

  <ul class="menu" id="menu"></ul>
  <div class="koreksi"><span>Ada kesalahan penulisan nama di sertifikat?</span><a href="perbaiki.html">Perbaiki data sertifikat &rsaquo;</a></div>
</main>
<footer data-cfg="FOOTER"></footer>
<script src="config.js"></script>
<script src="common.js"></script>
<script>
const IKON = {
  pen:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/>',
  video:'<rect x="2" y="6" width="14" height="12" rx="2"/><path d="M22 8l-6 4 6 4z"/>',
  gambar:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>',
  dokumen:'<path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8"/>',
  medali:'<circle cx="12" cy="8" r="6"/><path d="M15.5 13.5L17 22l-5-3-5 3 1.5-8.5"/>',
  tautan:'<path d="M10 13a5 5 0 007 0l3-3a5 5 0 00-7-7l-1 1"/><path d="M14 11a5 5 0 00-7 0l-3 3a5 5 0 007 7l1-1"/>'
};
function pilihIkon(m){
  if (m.ikon && IKON[m.ikon]) return m.ikon;
  const j = m.judul.toLowerCase();
  if (j.includes("hadir") || j.includes("presensi")) return "pen";
  if (j.includes("background") || j.includes("latar")) return "gambar";
  if (j.includes("zoom") || j.includes("meet")) return "video";
  if (j.includes("materi")) return "dokumen";
  if (j.includes("sertifikat")) return "medali";
  return "tautan";
}
$("#menu").innerHTML = C.MENU.map(m => {
  const k = pilihIkon(m);
  return '<li><a class="tombol" href="'+m.href+'"'+(m.luar?' target="_blank" rel="noopener"':'')+'>'
    +'<span class="ikon'+(k==="medali"?' emas':'')+'"><svg viewBox="0 0 24 24" aria-hidden="true">'+IKON[k]+'</svg></span>'
    +'<span>'+m.judul+'</span></a></li>';
}).join("");

const dua = n => String(n).padStart(2,"0");
function tick(){
  const sisa = waktuMulai() - Date.now();
  if (sisa <= 0){
    $("#hitung").hidden = true;
    const b = $("#status"); b.hidden = false;
    b.textContent = Date.now() > new Date(C.SELESAI).getTime()
      ? "Kegiatan telah selesai — sertifikat tetap dapat diunduh." : "Kegiatan sudah dimulai — selamat bergabung!";
    return;
  }
  const t = Math.floor(sisa/1000);
  $("#d").textContent = dua(Math.floor(t/86400));
  $("#h").textContent = dua(Math.floor(t%86400/3600));
  $("#m").textContent = dua(Math.floor(t%3600/60));
  $("#s").textContent = dua(t%60);
}
tick(); setInterval(tick,1000);
</script>
</body></html>
